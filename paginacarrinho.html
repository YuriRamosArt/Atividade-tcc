<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="STYLE/header.css">
    <link rel="stylesheet" href="STYLE/paginacarrinho.css">
    <title>carrinho</title>
</head>
<body>
     <!-- HEADER AQUI -->
  <header>
    <div class="top-bar">
      frete gratis
    </div>

    <div class="main-header">
      <div class="left">
        <img src="./IMAGENS/Logo.png" class="logo">
        <img src="./IMAGENS/MENU.png" class="menu-icon">

        <nav>
          <a href="./paginainicial.html" class="pag">inicio</a>
          <a href="paginaAcessórios.html"class="pag">acessórios<a>
          <a href="./roupas.html" class="pag">roupas</a>
          <a href="paginaSuplementos.html"class="pag">suplementos</a>
          </a>
        </nav>
      </div>

      <div class="right">
        <div class="search-box">
          <img src="./IMAGENS/Search.png" class="lupa">
          <input type="text" placeholder="Pesquisar...">
        </div>

        <div class="icons">
          <img src="./IMAGENS/carrinhodecompras.png" class="icon">
          <a href="login.html">
          <img src="./IMAGENS/login.png" class="icon">
          </a>
        </div>
  </header>

   <main class="carrinho-page">

        <!-- PRODUTOS -->
        <section class="produtos">

            <!-- Produto 1 -->
            <div class="produto">

                <div class="produto-imagem">
                    <img src="IMAGENS/coqueteleira.png" alt="Coqueteleira Darklab">
                </div>

                <div class="produto-info">
                    <h2>DARKLAB coqueteleira<br>- 900ml</h2>
                    <span class="preco">R$69,99</span>
                </div>

                <div class="produto-controle">
                    <div class="quantidade">
                        <button>+</button>
                        <span>1</span>
                        <button>-</button>
                    </div>

                    <button class="remover">REMOVER</button>
                </div>

            </div>


            <!-- Produto 2 -->
            <div class="produto">

                <div class="produto-imagem">
                    <img src="IMAGENS/garrafaGrande.png" alt="Whey">
                </div>

                <div class="produto-info">
                    <h2>GALÃODUX- de água-<br>1,8L</h2>
                    <span class="preco">R$49,99</span>
                </div>

                <div class="produto-controle">
                    <div class="quantidade">
                        <button>+</button>
                        <span>1</span>
                        <button>-</button>
                    </div>

                    <button class="remover">REMOVER</button>
                </div>

            </div>


            <!-- Produto 3 -->
            <div class="produto">

                <div class="produto-imagem">
                    <img src="IMAGENS/wheyMax.png" alt="Max Whey">
                </div>

                <div class="produto-info">
                    <h2>MAX WHEY baunilha -<br>900 g</h2>
                    <span class="preco">R$29,99</span>
                </div>

                <div class="produto-controle">
                    <div class="quantidade">
                        <button>+</button>
                        <span>1</span>
                        <button>-</button>
                    </div>

                    <button class="remover">REMOVER</button>
                </div>

            </div>

        </section>


        <!-- CHECKOUT -->
        <section class="checkout">

            <h1>
                CARRINHO
                <span>DA AYSI</span>
            </h1>

            <form>

                <input
                    type="email"
                    placeholder="EMAIL"
                >

                <input
                    type="password"
                    placeholder="SENHA"
                >

                <div class="documentos">

                    <select>
                        <option value="">N°</option>
                        <option>1</option>
                        <option>2</option>
                    </select>

                    <input
                        type="text"
                        placeholder="CPF"
                    >

                </div>

                <small>*selecione</small>

                <button
                    type="button"
                    class="pagamento"
                >
                    FORMAS DE PAGAMENTO
                </button>

                <button
                    type="submit"
                    class="finalizar"
                >
                    FINALIZAR COMPRA
                </button>

            </form>

        </section>

    </main>
    
</body>
</html>
