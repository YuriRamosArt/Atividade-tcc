<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="STYLE/header.css">
    <link rel="stylesheet" href="STYLE/paginacarrinho.css">
    <title>carrinho</title>
</head>
<body>
     <!-- HEADER AQUI -->
  <header>
    <div class="top-bar">
      frete gratis
    </div>

    <div class="main-header">
      <div class="left">
        <img src="./IMAGENS/Logo.png" class="logo">
        <img src="./IMAGENS/MENU.png" class="menu-icon">

        <nav>
          <a href="./paginainicial.html" class="pag">inicio</a>
          <a href="paginaAcessórios.html"class="pag">acessórios<a>
          <a href="./roupas.html" class="pag">roupas</a>
          <a href="paginaSuplementos.html"class="pag">suplementos</a>
          </a>
        </nav>
      </div>

      <div class="right">
        <div class="search-box">
          <img src="./IMAGENS/Search.png" class="lupa">
          <input type="text" placeholder="Pesquisar...">
        </div>

        <div class="icons">
          <img src="./IMAGENS/carrinhodecompras.png" class="icon">
          <a href="login.html">
          <img src="./IMAGENS/login.png" class="icon">
          </a>
        </div>
  </header>

    <div class="main-container">
        
        <!-- Lista de Produtos Omitindo o Header -->
        <div class="cart-items">
            
            <!-- Produto 1 -->
            <div class="product-card">
                <div class="product-image">DARKLAB</div>
                <div class="product-details">
                    <div class="product-name">DARKLAB coqueteleira - 900ml</div>
                    <div class="product-price">R$69,99</div>
                </div>
                <div class="quantity-actions">
                    <div class="quantity-controls">
                        <button class="qty-btn">+</button>
                        <span class="qty-number">1</span>
                        <button class="qty-btn">-</button>
                    </div>
                    <button class="remove-btn">Remover</button>
                </div>
            </div>

            <!-- Produto 2 -->
            <div class="product-card">
                <div class="product-image">GALÃODUX</div>
                <div class="product-details">
                    <div class="product-name">GALÃODUX- de água - 1,8L</div>
                    <div class="product-price">R$49,99</div>
                </div>
                <div class="quantity-actions">
                    <div class="quantity-controls">
                        <button class="qty-btn">+</button>
                        <span class="qty-number">1</span>
                        <button class="qty-btn">-</button>
                    </div>
                    <button class="remove-btn">Remover</button>
                </div>
            </div>

            <!-- Produto 3 -->
            <div class="product-card">
                <div class="product-image">MAX WHEY</div>
                <div class="product-details">
                    <div class="product-name">MAX WHEY baunilha - 900 g</div>
                    <div class="product-price">R$29,99</div>
                </div>
                <div class="quantity-actions">
                    <div class="quantity-controls">
                        <button class="qty-btn">+</button>
                        <span class="qty-number">1</span>
                        <button class="qty-btn">-</button>
                    </div>
                    <button class="remove-btn">Remover</button>
                </div>
            </div>

        </div>

        <!-- Formulário de Finalização -->
        <div class="checkout-form">
            <h1 class="checkout-title">CARRINHO <span>DA AYSI</span></h1>
            
            <div class="input-group">
                <label>EMAIL</label>
                <input type="email">
            </div>

            <div class="input-group">
                <label>SENHA</label>
                <input type="password">
            </div>

            <div class="row-inputs">
                <div class="input-group w-30">
                    <label>N°</label>
                    <select>
                        <option value=""></option>
                    </select>
                </div>
                <div class="input-group w-70">
                    <label>CPF</label>
                    <input type="text">
                </div>
            </div>
            <div class="select-subtext">*selecione</div>

            <button class="btn-payment">Formas de Pagamento</button>
            <button class="btn-finalize">Finalizar Compra</button>
        </div>

    </div>
    
</body>
</html>
